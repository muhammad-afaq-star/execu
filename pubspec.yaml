name: execu
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Local Persistence & Core Framework
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  uuid: ^4.5.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  cupertino_icons: ^1.0.8

  # Alarm & Media Infrastructure Integration
  flutter_local_notifications: ^17.2.1
  android_alarm_manager_plus: ^4.0.3
  timezone: ^0.9.4
  fluttertoast: ^8.2.8
  permission_handler: ^11.3.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/execu_logo.png

# ================= SPLASH SCREEN =================

flutter_native_splash:
  color: "#1976D2"
  image: assets/execu_logo.png
  android: true
  ios: true

  android_12:
    color: "#1976D2"
    image: assets/execu_logo.png
    icon_background_color: "#1976D2"

# ================= APP ICON =================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/execu_logo.png"